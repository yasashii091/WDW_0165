    <body>
        <center><h1>Hotel Room Booking Form</h1></center>

            <option value="suite">Suite</option>
        </select><br><br>
    </div></center>
    <center>><div class="seven"> <label for="guest">Number Of Guest::</label>
        <input type="number" id="guest" name="guest" min="1" required><br><br>
    </div></center>
   <center><div class="eight"> <label for="requests">Special Request:</label><br>
        <textarea id="request" name="request"></textarea><br><br>
    </div></center>

        <button type="reset">Reset form</button>
        <div></div></center>
</form>
